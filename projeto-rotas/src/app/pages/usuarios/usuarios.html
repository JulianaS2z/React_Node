<section class="usuarios-page">
  <div class="form-panel">
    <div class="section-head">
      <span class="badge">Cadastrar usuário</span>
      <h2>Adicionar novo usuário</h2>
    </div>

    <form #formUsuario="ngForm" (ngSubmit)="adicionarUsuario()" class="usuario-form">
      <div class="field-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" [(ngModel)]="nome" required />
      </div>

      <div class="field-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required />
      </div>

      <div class="field-group">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" [(ngModel)]="telefone" placeholder="(00) 00000-0000" />
      </div>

      <button type="submit" [disabled]="!formUsuario.form.valid">Adicionar usuário</button>
    </form>
  </div>

  <div class="list-panel">
    <div class="section-head">
      <span class="badge">Lista</span>
      <h3>Usuários cadastrados</h3>
    </div>

    @if (usuarios.length === 0) {
      <p class="empty-state">Nenhum usuário cadastrado ainda.</p>
    } @else {
      <ul class="usuario-list">
        @for (usuario of usuarios; track usuario.id) {
          <li>
            <div>
              <strong>{{ usuario.nome }}</strong>
              <span>{{ usuario.email }}</span>
            </div>
            <small>{{ usuario.telefone ?? 'Sem telefone' }}</small>
          </li>
        }
      </ul>
    }
  </div>
</section>
